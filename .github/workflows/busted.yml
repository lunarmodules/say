name: Busted

on: [ push, pull_request ]

jobs:

  busted:
    strategy:
      fail-fast: false
      matrix:
        luaVersion: [ "5.4", "5.3", "5.2", "5.1", "luajit" ] # , "luajit-openresty" ]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup ‘lua’
        uses: luarocks/gh-actions-lua@fc6f8de246f8c01f6e1a56a1b851143e23370ff3 # v12
        with:
          luaVersion: ${{ matrix.luaVersion }}

      - name: Setup ‘luarocks’
        uses: luarocks/gh-actions-luarocks@95d2308a0aff36ad31ebadca493ed14853399842 # v7

      - name: Setup dependencies
        run: |
          luarocks install busted
          luarocks install luacov-coveralls

      - name: Replace system say with self
        run: |
          luarocks remove say --force
          luarocks make

      - name: Run regression tests
        # disable project-local path prefixes to force use of system installation
        run: busted --coverage --lpath="" --cpath="" -Xoutput --color

      - name: Report test coverage
        if: ${{ success() && github.repository == 'lunarmodules/say' }}
        continue-on-error: true
        run: luacov-coveralls -i src -e .luarocks
        env:
          COVERALLS_REPO_TOKEN: ${{ github.token }}
